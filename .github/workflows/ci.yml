name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check gofumpt and module files
        run: |
          files="$(git ls-files -z -- '*.go' | xargs -0 -r go run mvdan.cc/gofumpt@v0.12.0 -l --)"
          if [[ -n "$files" ]]; then
            printf 'Run just fmt for these files:\n%s\n' "$files"
            exit 1
          fi
          go mod tidy -diff
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -shuffle=on -count=1 -timeout=5m ./...

  vulnerabilities:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  image:
    name: Image
    needs: [lint, test, vulnerabilities]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA:0:8}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --build-arg VERSION="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image" .
          test "$(docker run --rm --network=none --read-only --tmpfs /tmp "$image" --version)" = "$GITHUB_SHA"
          docker run --rm -i --network=none --read-only --tmpfs /tmp --entrypoint /usr/bin/python "$image" - <<'PY'
          import os
          import shutil
          import subprocess

          assert os.getuid() == 10001
          assert shutil.which("sh") is None
          assert shutil.which("pip") is None
          subprocess.run([os.environ["YT_DLP_PATH"], "--version"], check=True)
          subprocess.run(["ffmpeg", "-version"], check=True, stdout=subprocess.DEVNULL)
          subprocess.run(["ffprobe", "-version"], check=True, stdout=subprocess.DEVNULL)
          PY
      - name: Publish image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
