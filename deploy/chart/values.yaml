image:
  repository: ghcr.io/replace-owner/replace-repo
  tag: replace-with-sha-tag
  # A digest takes priority over the tag.
  digest: ""
  pullPolicy: IfNotPresent

# Reference Secrets created outside this chart. Do not put credentials here.
existingSecret: igbot-secrets
cookiesSecret: ""
imagePullSecrets: []

maxConcurrentDownloads: 2
tmpSizeLimit: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 256m
    memory: 1Gi
    ephemeral-storage: 2Gi
