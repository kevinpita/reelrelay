image:
  repository: ghcr.io/kevinpita/reelrelay
  tag: <pending>
  digest: ""
  pullPolicy: IfNotPresent

existingSecret: igbot-secrets
cookiesSecret: ""
imagePullSecrets: []

maxConcurrentDownloads: 2
tmpSizeLimit: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 256m
    memory: 1Gi
    ephemeral-storage: 2Gi
