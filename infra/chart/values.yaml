image:
  repository: ghcr.io/kevinpita/reelrelay
  tag: <pending>
  digest: ""
  pullPolicy: IfNotPresent

existingSecret: reelrelay-secrets
cookiesSecret: ""
imagePullSecrets: []

# Enable after the shared Kubernetes auth mount is ready.
openbao:
  enabled: false
  server: https://bao.kevinpita.com
  # Terraform reads this value too. Use an audience accepted by the Kubernetes API.
  audience: "https://kubernetes.default.svc.cluster.local"

maxConcurrentDownloads: 2
tmpSizeLimit: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 256m
    memory: 1Gi
    ephemeral-storage: 2Gi
